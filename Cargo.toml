[package]
exclude = ["/target"]
name = "testkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Shared test utilities for Rust — test databases, HTTP servers, auth helpers, and assertions"
repository = "https://github.com/WyattAu/testkit"
keywords = ["test", "testing", "utilities", "mock"]
categories = ["development-tools::testing"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
jsonwebtoken = "9"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
